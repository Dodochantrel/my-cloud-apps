<div [formGroup]="form()">

    <label [for]="controlName()" class="label">
        @if(icon()) {
            <span class="material-symbols text-primary text-base!">{{ icon() }}</span>
        }
        {{ label() }} {{ form().get(controlName())?.errors?.['required'] ? '*' : '' }}
    </label>

    <br>

    <p-rating [name]="controlName()" [formControlName]="controlName()" [stars]="starCount()" />

    <app-input-error-message-component
        [controlName]="controlName()"
        [form]="form()"
    />
</div>
