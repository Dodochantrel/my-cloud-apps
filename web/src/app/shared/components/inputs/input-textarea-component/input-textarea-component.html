<div [formGroup]="form()">
    <label [for]="controlName()" class="label">{{ label() }} {{ form().get(controlName())?.errors?.['required'] ? '*' : '' }}</label><br>
    <textarea rows="5" cols="30" pTextarea [formControlName]="controlName()" [placeholder]="placeholder()" fluid></textarea>
    <app-input-error-message-component [controlName]="controlName()" [form]="form()" />
</div>
