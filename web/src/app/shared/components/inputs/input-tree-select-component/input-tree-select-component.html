<div [formGroup]="form()">
    <label [for]="controlName()" class="label">{{ label() }} {{ form().get(controlName())?.errors?.['required'] ? '*' : '' }}</label>
    <p-iconfield>
        <p-inputicon>
            <span class="material-symbols text-[18px]!">{{ icon() }}</span>
        </p-inputicon>
        <p-treeselect
            [formControlName]="controlName()"
            [options]="options()"
            [placeholder]="placeholder()"
            [showClear]="true"
            appendTo="body"
            fluid
            [filter]="true"
            [filterInputAutoFocus]="true"
            [pt]="{ label: { class: 'pl-[calc((var(--p-form-field-padding-x)*2)+var(--p-icon-size))]' } }"
        />
    </p-iconfield>
    <app-input-error-message-component [controlName]="controlName()" [form]="form()" />
</div>
