<div class="container flex justify-between w-full">
    @if(selectedSize() !== null) {
        <p-selectbutton [options]="sizes" [(ngModel)]="selectedSize" [multiple]="false" optionLabel="name" optionValue="value" class="" />
    } @else {
        <div></div>
    }
    <p-paginator [first]="(page() - 1) * limit()" [rows]="limit()" [totalRecords]="itemCount()" [rowsPerPageOptions]="[20, 50, 100]" (onPageChange)="onPaginationChange($event)" />
</div>
