<app-default-container-component>

    <app-video-information-component (getTrailer)="getTrailer()" [isLoading]="serieDetailsService.isLoadingVideo()"
        [isLoadingTrailer]="serieDetailsService.isLoadingTrailer()" [video]="serieDetailsService.video()"
        [(isVisibleTrailerDialog)]="serieDetailsService.isVisibleTrailerDialog" />

    <app-provider-component [isLoading]="serieDetailsService.isLoadingProviders()"
        [providers]="serieDetailsService.video()?.providers!" />

    <app-casting-component [isLoading]="serieDetailsService.isLoadingCasting()" [castings]="serieDetailsService.video()?.castings!" />

    <app-video-detail-component [video]="serieDetailsService.video()" />

</app-default-container-component>
