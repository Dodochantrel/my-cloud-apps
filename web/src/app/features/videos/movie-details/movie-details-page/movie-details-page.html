<app-default-container-component>

    <app-video-information-component (getTrailer)="getTrailer()" [isLoading]="movieDetailsService.isLoadingVideo()"
        [isLoadingTrailer]="movieDetailsService.isLoadingTrailer()" [video]="movieDetailsService.video()"
        [(isVisibleTrailerDialog)]="movieDetailsService.isVisibleTrailerDialog" />

    <app-provider-component [isLoading]="movieDetailsService.isLoadingProviders()"
        [providers]="movieDetailsService.video()?.providers!" />

    <app-casting-component [isLoading]="movieDetailsService.isLoadingCasting()" [castings]="movieDetailsService.video()?.castings!" />

    <app-video-detail-component [video]="movieDetailsService.video()" />

</app-default-container-component>
