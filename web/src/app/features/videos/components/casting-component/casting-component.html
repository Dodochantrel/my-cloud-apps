<div class="mt-8">

    <app-title-component styleClass="h2">Acteurs</app-title-component>

    <div class="flex w-full gap-4 overflow-x-auto py-4">

        @if (isLoading()) {
        <div class="flex flex-col gap-4 shrink-0 w-32">
            <p-skeleton width="128px" height="192px" />
            <p-skeleton width="100%" height="1.5rem" />
            <p-skeleton width="100%" height="1.5rem" />
        </div>
        <div class="flex flex-col gap-4 shrink-0 w-32">
            <p-skeleton width="128px" height="192px" />
            <p-skeleton width="100%" height="1.5rem" />
            <p-skeleton width="100%" height="1.5rem" />
        </div>
        <div class="flex flex-col gap-4 shrink-0 w-32">
            <p-skeleton width="128px" height="192px" />
            <p-skeleton width="100%" height="1.5rem" />
            <p-skeleton width="100%" height="1.5rem" />
        </div>
        } @else {
        @for (item of castings(); track $index) {
        <div class="flex flex-col gap-4 shrink-0 w-32">
            <img [src]="item.fileUrlOrEmpty" alt="actor" class="w-32 h-48 object-cover rounded-md" />
            <p class="font-bold text-center h-12 overflow-hidden text-ellipsis line-clamp-4" [pTooltip]="item.name"
                tooltipPosition="bottom">{{ item.name }}</p>
            <p class="text-muted-color text-center h-18 overflow-hidden text-ellipsis line-clamp-4"
                [pTooltip]="item.character" tooltipPosition="bottom">{{ item.character }}</p>
        </div>
        } @empty {
        <p>Aucun acteur annoncé</p>
        }
        }


    </div>

</div>
