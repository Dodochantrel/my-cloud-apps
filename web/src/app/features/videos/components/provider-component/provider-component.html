<div class="mt-8">

    <app-title-component styleClass="h2">Plateformes</app-title-component>

    <div class="flex gap-4">

        @if (isLoading()) {
            <div class="flex flex-col gap-2 w-32 rounded-md border border-surface p-2">
                <p-skeleton height="4rem" />
            </div>
            <div class="flex flex-col gap-2 w-32 rounded-md border border-surface p-2">
                <p-skeleton height="4rem" />
            </div>
            <div class="flex flex-col gap-2 w-32 rounded-md border border-surface p-2">
                <p-skeleton height="4rem" />
            </div>
        } @else {
            @for (item of providers(); track $index) {
                <div class="flex flex-col gap-2 w-32 rounded-md border border-surface p-2">
                    <img [src]="item.fileUrl" alt="provider" class="h-12 object-contain rounded-md" />
                    <p class="text-center">{{ item.name }}</p>
                </div>
            }
        }

    </div>

</div>
