<div class="flex flex-col w-60 h-full rounded-md border border-surface relative">
    <img class="w-full h-84 rounded-l-md object-cover" [src]="video().fileUrl" alt="Thumbnail de la vidéo" />
    <div class="absolute top-0 left-0 right-0 h-24 bg-linear-to-b from-black/90 to-transparent rounded-t-md pointer-events-none"></div>
    <div class="p-4 flex flex-col gap-2 flex-1">
        <h3 class="text-lg font-semibold h-14 overflow-hidden">{{ video().title }}</h3>
        <div class="flex justify-between mt-auto">
            <p class="text-md text-secondary flex items-center gap-1">{{ video().globalRatingFormatted }}<span class="material-symbols text-amber-300 text-[20px]!">star</span></p>
            <p class="text-md text-secondary">{{ video().releaseDate | date:'dd/MM/yyyy' }}</p>
        </div>
        <a [routerLink]="'/movies/details/'+video().id" class="self-end text-primary underline cursor-pointer">détails</a>
    </div>
    <div class="absolute top-2 right-2 flex z-10">
        <p-button icon="pi pi-bookmark" [rounded]="true" [text]="true" severity="secondary" />
        <p-button icon="pi pi-heart" [rounded]="true" [text]="true" severity="danger" />
    </div>
</div>
