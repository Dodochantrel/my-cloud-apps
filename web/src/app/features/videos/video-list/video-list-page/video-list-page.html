<app-default-container-component [title]="title">

    <div class="flex flex-col w-full gap-4">

        <div class="flex w-full gap-4 items-end mt-4">

            <app-input-auto-complete-component [label]="searchLabel" [icon]="'person_add'"
                (searchChange)="onSearchChange($event)" class="flex-1" [placeholder]="searchPlaceholder"
                [items]="videos()" (valueSelected)="redirectToVideoDetails($event)">

                <ng-template #itemTemplate let-item>
                    <div class="flex items-center gap-2">
                        <img [src]="item.value.fileUrlOrEmpty" style="width: 18px" />
                        <div>{{ item.value.title }}</div>
                    </div>
                </ng-template>

            </app-input-auto-complete-component>

        </div>


        <p-tabs value="0">

            <p-tablist>
                <p-tab value="0">
                    <div class="flex gap-2 items-center h-full">
                        <span class="material-symbols">movie</span>
                        À l’affiche
                    </div>
                </p-tab>
                <p-tab value="1">
                    <div class="flex gap-2 items-center h-full">
                        <span class="material-symbols">connected_tv</span>
                        Prochainement chez moi
                    </div>
                </p-tab>
                <p-tab value="2">
                    <div class="flex gap-2 items-center h-full">
                        <span class="material-symbols">preview</span>
                        C’est checké
                    </div>
                </p-tab>
            </p-tablist>

            <p-tabpanels>
                <p-tabpanel value="0">
                    <app-current-video-component [type]="videoListService.type()" />
                </p-tabpanel>
                <p-tabpanel value="1">
                    <app-to-watch-video-component [type]="videoListService.type()" />
                </p-tabpanel>
                <p-tabpanel value="2">
                    <app-watched-video-component [type]="videoListService.type()" />
                </p-tabpanel>
            </p-tabpanels>

        </p-tabs>

    </div>

</app-default-container-component>
