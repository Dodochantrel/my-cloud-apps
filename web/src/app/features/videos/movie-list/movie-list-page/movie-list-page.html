<app-default-container-component title="Liste des films">

    <div class="flex flex-col w-full gap-4">

        <div class="flex w-full gap-4 items-end mt-4">
            <app-video-search-input-component
                class="w-full"
                label="Rechercher un film"
                placeholder="Seven"
                [search]="movieListService.search()"
                [videos]="movieListService.videos()"
                (searchChange)="onSearchChange($event)"
                (videoSelected)="redirectToVideoDetails($event)"
            />
        </div>

        <p-tabs value="0">

                <p-tablist>
                    <p-tab value="0">
                        <div class="flex gap-2 items-center h-full">
                            <span class="material-icons-outlined">movie</span>
                            À l’affiche <!-- autre noms possible (Sur grand écran / Les sorties du moment)-->
                        </div>
                    </p-tab>
                    <p-tab value="1">
                        <div class="flex gap-2 items-center h-full">
                            <span class="material-icons-outlined">connected_tv</span>
                            Prochainement chez moi <!-- autre noms possible (À caser un soir / Dans le viseur)-->
                        </div>
                    </p-tab>
                    <p-tab value="2">
                        <div class="flex gap-2 items-center h-full">
                            <span class="material-icons-outlined">preview</span>
                            C’est checké <!-- autre noms possible (Mission terminée)-->
                        </div>
                    </p-tab>
                </p-tablist>

                <p-tabpanels>
                    <p-tabpanel value="0">
                    </p-tabpanel>
                    <p-tabpanel value="1">
                    </p-tabpanel>
                    <p-tabpanel value="2">
                        <app-footer-table-component 
                            [itemCount]="100" 
                            [selectedSize]="null"
                            [(page)]="movieListService.page" 
                            [(limit)]="movieListService.limit"
                        />
                    </p-tabpanel>
                </p-tabpanels>

            </p-tabs>

    </div>
    

</app-default-container-component>
