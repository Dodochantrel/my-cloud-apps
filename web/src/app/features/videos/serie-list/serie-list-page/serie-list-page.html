<app-default-container-component title="Liste des séries">

    <div class="flex flex-col w-full gap-4">

        <div class="flex w-full gap-4 items-end mt-4">
            <div class="w-full">
                <label>Rechercher une série</label>
                <p-autocomplete 
                    placeholder="Breaking Bad" 
                    [ngModel]="serieListService.search()" 
                    (ngModelChange)="onSearchChange($event)"
                    [suggestions]="serieListService.videos()" 
                    [optionLabel]="'title'"
                    [forceSelection]="false"
                    fluid 
                    [showEmptyMessage]="true"
                    (onSelect)="redirectToVideoDetails($event)"
                >
                    <ng-template let-video #item>
                        <div class="flex items-center gap-2">
                            <img [src]="video.fileUrl" style="width: 18px" />
                            <div>{{ video.title }}</div>
                        </div>
                    </ng-template>
                </p-autocomplete>
            </div>
        </div>

        <app-footer-table-component 
            [itemCount]="100" 
            [selectedSize]="null"
            [(page)]="serieListService.page" 
            [(limit)]="serieListService.limit"
        />

    </div>
    

</app-default-container-component>
