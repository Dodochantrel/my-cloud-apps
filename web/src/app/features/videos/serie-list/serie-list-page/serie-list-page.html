<app-default-container-component title="Liste des séries">

    <div class="flex flex-col w-full gap-4">

        <div class="flex w-full gap-4 items-end mt-4">
            <app-video-search-input-component
                class="w-full"
                label="Rechercher une série"
                placeholder="Breaking Bad"
                [search]="serieListService.search()"
                [videos]="serieListService.videos()"
                (searchChange)="onSearchChange($event)"
                (videoSelected)="redirectToVideoDetails($event)"
            />
        </div>

        <app-footer-table-component 
            [itemCount]="100" 
            [selectedSize]="null"
            [(page)]="serieListService.page" 
            [(limit)]="serieListService.limit"
        />

    </div>
    

</app-default-container-component>
