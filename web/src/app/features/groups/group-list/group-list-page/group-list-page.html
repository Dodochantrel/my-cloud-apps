<app-default-container-component [title]="'Gestion des groupes'">

    <div class="flex gap-4 items-end">

        <app-header-search-component [label]="'Rechercher un groupe'" [icon]="'search'" class="flex-1"
            [placeholder]="'Entrez le nom du groupe...'" [(input)]="groupListService.search" />

        <button pButton (click)="handleCreate()">
            <i class="pi pi-plus-circle" pButtonIcon></i>
            <span pButtonLabel>Ajouter</span>
        </button>

    </div>

    <p-divider />

    <div class="flex gap-4 flex-wrap">
        @for (group of groupStore.data(); track $index) {
        <app-group-card-component [group]="group" class="flex-1" />
        }
    </div>

</app-default-container-component>

<app-create-or-edit-group-component [(isDisplay)]="isDisplayCreateOrEditGroup" [isCreating]="isCreatingCreateOrEditGroup()" />
