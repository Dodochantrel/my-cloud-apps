<app-default-container-component title="Gallerie">

    <div class="flex gap-4 items-end">

        <app-input-text-component [label]="'Rechercher une catégorie'" [icon]="'search'" class="flex-1"
            [placeholder]="'Entrez le nom de la catégorie...'" [(value)]="galleryListService.search" />

    </div>

    <p-divider />

    <div class="flex">

        <p-tree [value]="galleryCategoryStore.data()" class="w-full md:w-120" selectionMode="single" (onNodeSelect)="categorySelected($event)">
            <ng-template let-node pTemplate="footer">
                <div class="mt-4">
                    <p-button (click)="handleCreate()" variant="outlined" label="Ajouter une catégorie" icon="pi pi-plus-circle" />
                </div>
            </ng-template>
        </p-tree>

        <p-divider layout="vertical" />

        <div>



        </div>

    </div>

</app-default-container-component>

<app-create-or-edit-gallery-category-component [(isDisplay)]="isDisplayCreateOrEditDialog" />
