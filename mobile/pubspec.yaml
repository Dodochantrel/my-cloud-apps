name: mobile
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  # Networking
  dio: ^5.4.0
  
  # State Management
  riverpod: ^2.4.0
  flutter_riverpod: ^2.4.0
  
  # Local Storage
  shared_preferences: ^2.2.0
  
  # Security
  flutter_secure_storage: ^9.0.0
  
  # HTTP & Serialization
  json_annotation: ^4.8.0
  
  # Routing
  go_router: ^13.2.0

dev_dependencies:
  build_runner: ^2.4.0
  json_serializable: ^6.7.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
